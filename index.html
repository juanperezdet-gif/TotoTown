    function entry() {

la no sustituye la responsiva f\xEDsica ni su firma.</p>${waiverRecorded.has(p.id) ? '<p class="pending-scope">Verificaci\xF3n de pr\xE1ctica registrada para este ingreso.</p>' : ""}</section><div class="actions"><button class="primary" data-enter ${locked || !waiverConfirmed ? "disabled" : ""}>Registrar ingreso ${esc(entryMode)}</button><button data-nav="shop">Ir a Dulcer\xEDa \u2192</button></div><p class="pending-scope">La modalidad queda fija en la visita. Cambiar PLAY \u2194 CARE est\xE1 pendiente y no se simula.</p></section><aside class="panel"><div class="panel-head"><div><h2>La familia hoy</h2><p>Selecciona al otro menor arriba para registrar su ingreso.</p></div></div>${participantRows()}<hr class="section-divider"><p class="eyebrow">Reloj manual</p><p class="muted" style="font-size:.86rem;margin-top:8px">Usa +15 min para practicar el c\xE1lculo del tiempo. Con duraci\xF3n cero, la tarifa queda pendiente y no se puede pagar.</p></aside></div>`;

ecios de pr\xE1ctica en MXN</p><p class="pending-scope image-disclaimer">Im\xE1genes ilustrativas para la pr\xE1ctica; no definen recetas, porciones ni ingredientes del producto real.</p><div class="catalog-layout"><section class="product-grid" aria-label="Productos">${filtered.length ? filtered.map(productCard).join("") : '<div class="empty"><h3>No hay coincidencias</h3><p>Prueba otro nombre o categor\xEDa.</p></div>'}</section><aside class="panel cart-panel"><p class="eyebrow">Cuenta por persona</p><h2 style="margin-top:7px">${esc(selected()?.name)}</h2><p class="muted tiny" style="margin-top:6px">Los consumos pasan a la cuenta familiar.</p>${product ? `<section class="selection-card"><h3>${esc(describeProduct2(product.product_id, product.name).title)}</h3><p>${product.category === "Actividades" ? "Entrega de kit \xFAnicamente. Nanita inicia despu\xE9s." : "Confirma antes de registrar este consumo."}</p><label>Cantidad<input data-quantity type="number" min="1" max="${product.category === "Actividades" ? 1 : 20}" step="1" value="${selection.quantity}" ${product.category === "Actividades" ? "readonly" : ""}></label><label class="check-row consumption-confirm"><input type="checkbox" data-consumption-confirm ${selection.confirmed ? "checked" : ""}>${product.category === "Actividades" ? "Confirmo persona, familia, actividad e importe, y he entregado f\xEDsicamente este kit en la pr\xE1ctica." : "Confirmo persona, familia, producto, cantidad e importe del ensayo."}</label><button class="primary" data-confirm-consumption ${!selection.confirmed ? "disabled" : ""}>${product.category === "Actividades" ? "Confirmar entrega de kit" : "Confirmar consumo"} \xB7 ${money(product.price_minor * selection.quantity)}</button><button data-cancel-selection>Cancelar selecci\xF3n</button></section>` : ""}<div class="cart-list">${lines.length ? lines.slice().reverse().map((l) => `<div class="cart-line"><strong>${esc(l.displayName ?? l.productName)}</strong><div class="line-meta"><span>${l.quantity} \xD7 ${money(l.unitPriceMinor)}</span><b class="money">${money(l.totalMinor)}</b></div>${l.kind === "KIT" ? `<small class="muted">${esc(statusLabel(l.status))} \xB7 no inicia autom\xE1ticamente</small>` : ""}</div>`).join("") : '<p class="empty-small">A\xFAn no hay consumos para esta persona.</p>'}</div><div class="cart-total"><span>Consumos</span><span class="money">${money(lines.reduce((n, l) => n + l.totalMinor, 0))}</span></div><button style="width:100%" data-nav="account">Ver cuenta familiar</button><p class="pending-scope">Los kits requieren una actividad y una salida f\xEDsica. No hay cancelaci\xF3n de kits en este ejercicio.</p></aside></div>`;

="section-divider"><p class="muted" style="font-size:.84rem">Si hay una actividad en curso o un kit pendiente, el retiro se detiene con una explicaci\xF3n. La cuenta contin\xFAa abierta hasta completar ambos retiros.</p></aside></div>`;

    }
    function checkout() {
      if (!currentState.family) return emptyFamily();
      if (currentState.payment) {
        const note = showNote ? simulator.readNote() : null;
        return `<section class="panel no-print"><div class="panel-head"><div><p class="eyebrow">Cierre terminado</p><h2 style="margin-top:8px">Pago simulado registrado</h2><p>${esc(currentState.family.name)} \xB7 ${esc(paymentLabel(currentState.payment.method))}</p></div>${badge("PAGADO \xB7 SIMULACI\xD3N", "green")}</div>${totals()}${notice("No se hizo un cobro real. La cuenta est\xE1 cerrada y no acepta un segundo pago.", "success")}<div class="actions"><button class="primary" data-read-note>Consultar nota de pr\xE1ctica</button><button data-nav="account">Ver detalle de la cuenta</button></div><p class="pending-scope">La impresi\xF3n es opcional y se hace despu\xE9s de consultar la nota.</p></section>${note ? `${receipt(note)}<div class="note-actions no-print"><button class="primary" data-print>Imprimir nota simulada</button><button data-close-note>Cerrar vista de nota</button></div>` : '<p class="print-warning" hidden>SIMULADO \xB7 No hay una nota abierta para imprimir. Consulta la nota de pr\xE1ctica en Caja.</p>'}`;
      }
      return `<div class="grid-two no-print"><section><h2 style="margin-bottom:16px">Revisi\xF3n antes del cierre</h2>${breakdown()}</section><aside class="panel"><p class="eyebrow">Caja familiar</p><h2 style="margin-top:8px">Confirmar pago de pr\xE1ctica</h2>${totals()}${blockerPanel()}<h3 style="margin-top:20px">M\xE9todo simulado</h3><label class="payment-method-field">M\xE9todo manual de prueba<select data-payment-method-select><option value="" ${!method ? "selected" : ""}>Seleccione m\xE9todo</option><option value="CASH" ${method === "CASH" ? "selected" : ""}>Efectivo \xB7 prueba</option><option value="CARD" ${method === "CARD" ? "selected" : ""}>Tarjeta \xB7 prueba</option></select></label><button class="primary" data-review-payment style="width:100%" ${!currentAccount.canPay || !["CASH", "CARD"].includes(method) ? "disabled" : ""}>Revisar pago simulado</button><p class="pending-scope">No se solicitan tarjetas, credenciales ni datos bancarios. No hay propinas en este ejercicio.</p></aside></div><p class="print-warning" hidden>SIMULADO \xB7 Cuenta sin pago confirmado. No es una nota ni un comprobante fiscal.</p>`;
    }
    function modalView() {
      if (!modal) return "";
      let body = "";
      if (modal.type === "reset") body = '<p class="eyebrow">Reiniciar capacitaci\xF3n</p><h2 id="dialog-title">\xBFComenzar de nuevo?</h2><p>Se borrar\xE1n los nombres editados, ingresos, consumos, actividades, retiros y pago de este ejercicio en memoria. No afecta datos reales.</p>';
      if (modal.type === "payment") body = `<p class="eyebrow">\xDAltima revisi\xF3n \xB7 s\xF3lo simulaci\xF3n</p><h2 id="dialog-title">Confirmar pago familiar</h2><p>${esc(currentState.family.name)}<br>${esc(paymentLabel(modal.method))}</p><div class="confirm-total money">${money(modal.amountMinor)} <small class="muted tiny">MXN</small></div><p>Esta confirmaci\xF3n cierra la cuenta ficticia. Despu\xE9s podr\xE1s consultar e imprimir la nota sin volver a pagar.</p>`;
      if (modal.type === "depart") body = `<p class="eyebrow">Salida de actividad</p><h2 id="dialog-title">\xBFTermin\xF3 la salida f\xEDsica simulada?</h2><p>${esc(person(modal.participantId)?.name)} dejar\xE1 libre su lugar. Esta acci\xF3n no registra el retiro del menor ni un pago.</p>`;
      return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">${body}<div class="actions"><button data-cancel-modal>Volver</button><button class="${modal.type === "reset" ? "danger" : "primary"}" data-confirm-modal>${modal.type === "reset" ? "S\xED, reiniciar" : modal.type === "payment" ? "Confirmar pago simulado" : "Confirmar salida f\xEDsica"}</button></div></section></div>`;
    }
    function render() {
      if (destroyed) return;
      sync();
      const config = TABS.find((t) => t.id === tab);
      const body = { registration, entry, shop, activities, withdrawal, account, checkout }[tab]();
      root.innerHTML = `<div class="sim-banner">SIMULADOR \xB7 DATOS FICTICIOS \xB7 NO OPERA CLIENTES</div><header class="brandbar"><img class="papalos" src="assets/brand/papalos-lilac.png" alt="P\xE1palos by JP Solutions"><img class="toto" src="assets/brand/toto-town.png" alt="Toto Town by bowling"><nav class="role-actions" aria-label="Navegaci\xF3n de pr\xE1ctica">${HEADER_NAV.map((id) => `<button class="${id === tab ? "active" : ""}" data-nav="${id}" ${id === tab ? 'aria-current="page"' : ""}>${esc(HEADER_LABELS[id])}</button>`).join("")}</nav></header><div class="app-shell"><section class="training-toolbar" aria-label="Controles de capacitaci\xF3n"><div class="role-control"><label for="simulated-role">Rol simulado</label><select id="simulated-role" data-role>${ROLES.map((r) => `<option value="${esc(r)}" ${r === role ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></div><div class="clock-controls"><div class="clock-block"><small>Reloj de pr\xE1ctica \xB7 ${date(currentState.clockMs)} \xB7 M\xE9rida</small><time>${time(currentState.clockMs)}</time></div><button data-advance>+15 min</button><button data-reset>Reiniciar</button></div></section><header class="workspace-head"><div><p class="eyebrow">${esc(role)} \xB7 ${esc(config.label)}</p><h1 id="workspace-heading" tabindex="-1">${esc(config.title)}</h1><p>${esc(config.subtitle)}</p></div>${badge("PR\xC1CTICA LOCAL")}</header>${identity()}<div class="status-line" aria-live="polite">${message ? notice(message.text, message.kind, message.code) : ""}</div><main id="workspace">${body}</main><p class="pending-scope no-print">Fuera de este ejercicio: Fiesta, cambio PLAY \u2194 CARE y propinas. No est\xE1n incluidos en esta maqueta.</p><footer class="app-footer"><span>Seleccionar un m\xF3dulo ajusta el rol de pr\xE1ctica. No es un control de acceso productivo.</span><span>S\xF3lo esta pesta\xF1a \xB7 sin guardado permanente \xB7 revisi\xF3n ${currentState.revision}</span></footer></div>${modalView()}`;
      if (modal) root.querySelector(".modal")?.focus?.();
    }
    function onClick(event) {
      const button = event.target.closest?.("button");
      if (!button || !root.contains(button) || button.disabled) return;
      if (button.dataset.registerScan) {
        const id = button.dataset.registerScan;
        if (tab !== "registration" || !WRISTBANDS[id] || currentState.payment || registrationScans.has(id)) return;
        registrationScans.add(id);
        message = { text: `Escaneo simulado, sin c\xE1mara: ${WRISTBANDS[id]} asignado a ${memberLabel(id)}. Su nombre se conserva como borrador hasta guardar. No se cre\xF3 otra persona ni un ingreso.`, kind: "success" };
        render();
        return;
      }
      if (button.hasAttribute("data-open-scan")) {
        const id = selectedId;
        if (tab === "registration" || !person(id) || !WRISTBANDS[id] || !registrationScans.has(id)) return;
        selectParticipant(id);
        scannedParticipantId = id;
        modal = null;
        message = { text: `Lectura simulada de pulsera ya asignada, sin c\xE1mara \xB7 ${person(id).name} \xB7 ${memberLabel(id)} \xB7 ${WRISTBANDS[id]}. ${currentState.payment ? "Cuenta cerrada: s\xF3lo consulta. Reinicia para otro ejercicio." : person(id)?.type === "ADULT" ? canConsume(id) ? "Puedes agregar consumos del adulto a esta cuenta, sin tarifa de menor." : "Registra primero el ingreso de un menor de la familia." : visit(id)?.status === "WITHDRAWN" ? "Menor retirado: s\xF3lo consulta. El reingreso no forma parte de este ejercicio." : isInside(id) ? "Puedes elegir un consumo para este menor." : "Registra su ingreso antes de agregar consumos."}`, kind: "success" };
        render();
        return;
      }
      if (button.dataset.nav) {
        navigate(button.dataset.nav);
        return;
      }
      if (button.hasAttribute("data-advance")) {
        run(() => simulator.advanceMinutes(15), "Reloj avanzado 15 minutos. Los tiempos y la cuenta se actualizaron.");
        return;
      }
      if (button.hasAttribute("data-reset")) {
        modal = { type: "reset" };
        render();
        return;
      }
      if (button.hasAttribute("data-enter")) {
        if (!waiverConfirmed || visit(selectedId)) return;
        run(() => {
          const d = entryMode === "CARE" ? captureCare(selectedId) : null;
          const result = simulator.enter({ participantId: selectedId, mode: entryMode, responsibleAdultId: adult().id, requestId: requestId("entry") });
          waiverRecorded.add(selectedId);
          waiverConfirmed = false;
          if (d) careSaved.set(selectedId, d);
          careDrafts.delete(selectedId);
          return result;
        }, "Ingreso registrado para el menor seleccionado.");
        return;
      }
      if (button.dataset.shopView) {
        shopView = button.dataset.shopView;
        category = "cafeteria";
        search = "";
        selection = null;
        render();
        return;
      }
      if (button.dataset.category) {
        category = button.dataset.category;
        search = "";
        selection = null;
        render();
        return;
      }
      if (button.dataset.product) {
        selection = { productId: button.dataset.product, quantity: 1, participantId: selectedId, requestId: requestId("consumption"), confirmed: false };
        message = null;
        render();
        root.querySelector("[data-confirm-consumption]")?.scrollIntoView?.({ block: "nearest" });
        return;
      }
      if (button.hasAttribute("data-cancel-selection")) {
        selection = null;
        render();
        return;
      }
      if (button.hasAttribute("data-confirm-consumption")) {
        if (!selection || selection.confirmed !== true) return;
        const item = selection, kit = PRODUCT_BY_ID.get(item.productId)?.category === "Actividades";
        run(() => simulator.addConsumption({ ...item, confirmed: true }), kit ? "Kit entregado. Ahora inicia la actividad en Nanita." : "Consumo registrado en la persona y la cuenta familiar.", () => {
          selection = null;
        });
        return;
      }
      if (button.dataset.startActivity) {
        run(() => simulator.startActivity({ lineId: button.dataset.startActivity, requestId: requestId("start") }), "Actividad iniciada. El lugar queda ocupado hasta confirmar su salida f\xEDsica.");
        return;
      }
      if (button.dataset.departActivity) {
        const a = currentState.activities.find((a2) => a2.id === button.dataset.departActivity);
        modal = { type: "depart", activityId: a.id, participantId: a.participantId, requestId: requestId("depart") };
        render();
        return;
      }
      if (button.hasAttribute("data-withdraw")) {
        run(() => simulator.withdraw({ participantId: selectedId, adultId: adult().id, identityConfirmed: withdrawalChecks.identity, authorizationConfirmed: withdrawalChecks.authorization, physicalDepartureConfirmed: withdrawalChecks.physical, requestId: requestId("withdraw") }), "Retiro individual simulado registrado.", () => {
          withdrawalChecks = { identity: false, authorization: false, physical: false };
        });
        return;
      }
      if (button.hasAttribute("data-review-payment")) {
        modal = { type: "payment", method, amountMinor: currentAccount.totalMinor, requestId: requestId("payment") };
        render();
        return;
      }
      if (button.hasAttribute("data-cancel-modal")) {
        modal = null;
        render();
        return;
      }
      if (button.hasAttribute("data-confirm-modal")) {
        const action = modal;
        if (!action) return;
        modal = null;
        if (action.type === "reset") run(() => simulator.reset({ confirmed: true }), "Ejercicio reiniciado. S\xF3lo permanecen los datos ficticios iniciales.", () => {
          tab = "registration";
          role = "Recepci\xF3n";
          selectedId = "sim-child-play";
          scannedParticipantId = null;
          registrationScans.clear();
          waiverConfirmed = false;
          waiverRecorded.clear();
          careDrafts.clear();
          careSaved.clear();
          entryMode = "PLAY";
          selection = null;
          showNote = false;
          registrationDraft = null;
          registrationConfirmed = false;
          withdrawalChecks = { identity: false, authorization: false, physical: false };
          category = "cafeteria";
          shopView = "goods";
          search = "";
          method = "";
        });
        if (action.type === "payment") run(() => simulator.recordPayment({ method: action.method, amountMinor: action.amountMinor, confirmed: true, requestId: action.requestId }), "Pago simulado registrado una sola vez. Consulta la nota para revisarla o imprimirla.", () => {
          showNote = false;
        });
        if (action.type === "depart") run(() => simulator.departActivity({ activityId: action.activityId, physicalDepartureConfirmed: true, requestId: action.requestId }), "Salida de actividad registrada. El lugar est\xE1 libre; el retiro del menor se hace por separado.");
        return;
      }
      if (button.hasAttribute("data-read-note")) {
        try {
          const note = simulator.readNote();
          if (!note) throw new Error("Todav\xEDa no hay una nota de pago simulado.");
          showNote = true;
          message = null;
          render();
        } catch (e) {
          message = { text: e.message, kind: "error" };
          render();
        }
        return;
      }
      if (button.hasAttribute("data-close-note")) {
        showNote = false;
        render();
        return;
      }
      if (button.hasAttribute("data-print")) {
        try {
          if (!simulator.readNote()) throw new Error("Primero consulta una nota de pago simulado.");
          onPrint();
        } catch (e) {
          message = { text: `No se pudo abrir la impresi\xF3n: ${e.message}`, kind: "error" };
          render();
        }
        return;
      }
    }
    function onInput(event) {
      const target = event.target;
      if (target.dataset.careField && entryMode === "CARE" && !visit(selectedId) && ["estimate", "name", "phone", "relationship"].includes(target.dataset.careField)) {
        careDraft(selectedId)[target.dataset.careField] = target.value;
      }
      if (target.dataset.registrationField) {
        registrationDraft[target.dataset.registrationField] = target.value;
        registrationConfirmed = false;
        const box = root.querySelector("[data-registration-confirm]");
        if (box) box.checked = false;
      }
    }
    function onChange(event) {
      const target = event.target;
      if (target.hasAttribute("data-entry-waiver") && tab === "entry" && !visit(selectedId) && selected()?.type === "CHILD") {
        waiverConfirmed = target.checked === true;
        render();
      }
      if (target.hasAttribute("data-entry-mode") && !visit(selectedId) && !currentState.payment) {
        waiverConfirmed = false;
        entryMode = target.value;
        careDrafts.delete(selectedId);
        render();
      }
      if (target.hasAttribute("data-payment-method-select")) {
        method = ["CASH", "CARD"].includes(target.value) ? target.value : "";
        render();
      }
      if (target.hasAttribute("data-consumption-confirm") && selection) {
        selection.confirmed = target.checked;
        render();
      }
      if (target.hasAttribute("data-select-person")) {
        if (!selectParticipant(target.value)) return;
        scannedParticipantId = null;
        message = null;
        render();
      }
      if (target.hasAttribute("data-role")) {
        role = target.value;
        const next = { Recepci\u00F3n: "registration", Dulcer\u00EDa: "shop", Nanita: "activities", Caja: "checkout" }[role];
        navigate(next);
      }
      if (target.hasAttribute("data-registration-confirm")) registrationConfirmed = target.checked;
      if (target.dataset.withdrawCheck) withdrawalChecks[target.dataset.withdrawCheck] = target.checked;
      if (target.hasAttribute("data-quantity") && selection) {
        const value = Number(target.value);
        selection.quantity = value;
        selection.confirmed = false;
        render();
      }
    }
    function onSubmit(event) {
      if (event.target.hasAttribute("data-register")) {
        event.preventDefault();
        if (!registrationConfirmed) {
          message = { text: "Confirma que todos los nombres son ficticios antes de guardarlos.", kind: "error", code: "SYNTHETIC_CONFIRMATION_REQUIRED" };
          render();
          return;
        }
        run(() => simulator.registerFamily({ familyName: registrationDraft.familyName, children: [{ id: "sim-child-play", name: registrationDraft.childPlay }, { id: "sim-child-care", name: registrationDraft.childCare }], adult: { id: "sim-adult", name: registrationDraft.adult }, requestId: requestId("register") }), "Nombres ficticios guardados. Se conservan las mismas personas y su informaci\xF3n en todos los m\xF3dulos.");
      }
      if (event.target.hasAttribute("data-search-form")) {
        event.preventDefault();
        search = root.querySelector("#catalog-search").value.trim();
        selection = null;
        render();
      }
    }
    function onKey(event) {
      if (!modal) return;
      if (event.key === "Escape") {
        event.preventDefault();
        modal = null;
        render();
        return;
      }
      if (event.key === "Tab") {
        const controls = [...root.querySelectorAll(".modal button:not(:disabled)")];
        const first = controls[0], last = controls.at(-1);
        if (event.shiftKey && (root.ownerDocument.activeElement === first || root.ownerDocument.activeElement === root.querySelector(".modal"))) {
          event.preventDefault();
          last?.focus();
        } else if (!event.shiftKey && root.ownerDocument.activeElement === last) {
          event.preventDefault();
          first?.focus();
        }
      }
    }
    root.addEventListener("click", onClick);
    root.addEventListener("change", onChange);
    root.addEventListener("input", onInput);
    root.addEventListener("submit", onSubmit);
    root.addEventListener("keydown", onKey);
    render();
    return { getState: () => simulator.getState(), getView: () => ({ tab, role, selectedId, scannedParticipantId, showNote }), navigate, render, destroy() {
      destroyed = true;
      root.removeEventListener("click", onClick);
      root.removeEventListener("change", onChange);
      root.removeEventListener("input", onInput);
      root.removeEventListener("submit", onSubmit);
      root.removeEventListener("keydown", onKey);
      root.replaceChildren();
    } };
  }
  if (typeof document !== "undefined") {
    const root = document.querySelector("#app");
    if (root) try {
      mountSimulator(root);
    } catch (error) {
      root.innerHTML = `<div class="sim-banner">SIMULADOR \xB7 DATOS FICTICIOS \xB7 NO OPERA CLIENTES</div><div class="boot-message">${notice(`No se pudo iniciar el simulador: ${error.message}`, "error")}<p>Det\xE9n el ejercicio y conserva este mensaje para revisi\xF3n. No se conect\xF3 a ning\xFAn servicio.</p></div>`;
    }
  }
})();
</script></body>
</html>
